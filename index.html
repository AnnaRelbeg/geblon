<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GEBLON | Wykończenia Wnętrz Bydgoszcz</title>
    <link rel="icon" type="image/png" href="images/favicon.png">
    <link rel="apple-touch-icon" href="images/GeblonFavicon.PNG">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: #1a1a1a;
            color: #fcfcfc;
            font-family: 'Montserrat', sans-serif;
            text-align: center;
            padding: 2rem;
        }
        .divider {
            width: 60px;
            height: 1px;
            background-color: #D4AF37;
            margin: 0 auto 2rem;
        }
        h1 {
            font-family: 'Playfair Display', serif;
            font-weight: 400;
            font-size: clamp(1.4rem, 4vw, 2rem);
            letter-spacing: 0.02em;
            margin-bottom: 1rem;
            color: #fcfcfc;
        }
        p {
            font-weight: 300;
            font-size: 0.95rem;
            color: #aaaaaa;
            letter-spacing: 0.04em;
            line-height: 1.7;
        }
    </style>
</head>
<body>
    <div class="divider"></div>
    <h1>Strona niedostępna</h1>
</body>
</html>
